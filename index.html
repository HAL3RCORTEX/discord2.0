<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConvoHub — Plataforma de Comunicação</title>

    <!-- ============================================================
    CSS
    ============================================================ -->
    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #111318;
            --bg-sidebar: #181A21;
            --bg-panel: #20232B;
            --bg-card: #272A33;
            --bg-input: #2F323D;
            --bg-hover: #3A3D4A;
            --text-primary: #FFFFFF;
            --text-secondary: #A7ACB8;
            --text-muted: #6A6F7E;
            --brand: #5865F2;
            --brand-dark: #4752C4;
            --brand-glow: rgba(88, 101, 242, 0.25);
            --green: #3BA55D;
            --red: #ED4245;
            --yellow: #FAA81A;
            --radius: 8px;
            --radius-sm: 4px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: 0.2s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ---------- SCROLLBAR ---------- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--bg-hover);
        }

        /* ---------- UTILITY ---------- */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flex-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-12 {
            gap: 12px;
        }
        .gap-16 {
            gap: 16px;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-secondary {
            color: var(--text-secondary);
        }
        .text-sm {
            font-size: 13px;
        }
        .text-xs {
            font-size: 11px;
        }
        .fw-600 {
            font-weight: 600;
        }
        .fw-500 {
            font-weight: 500;
        }
        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---------- BUTTONS ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: background var(--transition), transform 0.1s ease, box-shadow var(--transition);
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .btn:hover {
            background: var(--bg-hover);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--brand);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--brand-dark);
            box-shadow: 0 4px 20px var(--brand-glow);
        }
        .btn-success {
            background: var(--green);
            color: #fff;
        }
        .btn-success:hover {
            background: #2d8f4e;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-danger:hover {
            background: #c0353a;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }
        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            font-size: 18px;
        }
        .btn-icon:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .btn-icon-sm {
            width: 30px;
            height: 30px;
            font-size: 14px;
        }

        /* ---------- INPUTS ---------- */
        .input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
            transition: border var(--transition), box-shadow var(--transition);
            outline: none;
        }
        .input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-glow);
        }
        .input::placeholder {
            color: var(--text-muted);
        }

        /* ---------- TOAST ---------- */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
            pointer-events: none;
            max-width: 360px;
        }
        .toast {
            pointer-events: auto;
            padding: 14px 20px;
            border-radius: var(--radius);
            background: var(--bg-card);
            border-left: 4px solid var(--brand);
            box-shadow: var(--shadow);
            color: var(--text-primary);
            font-size: 14px;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast-success {
            border-left-color: var(--green);
        }
        .toast-error {
            border-left-color: var(--red);
        }
        .toast-warning {
            border-left-color: var(--yellow);
        }
        .toast-close {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 16px;
            background: none;
            border: none;
            padding: 0 4px;
        }
        .toast-close:hover {
            color: var(--text-primary);
        }

        @keyframes slideInRight {
            0% {
                opacity: 0;
                transform: translateX(40px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes slideOutRight {
            0% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(40px);
            }
        }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal {
            background: var(--bg-panel);
            border-radius: var(--radius);
            padding: 32px;
            max-width: 480px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            animation: scaleIn 0.25s ease;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .modal-sub {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes scaleIn {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ---------- AVATAR ---------- */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
            background: var(--bg-card);
            color: var(--text-primary);
            position: relative;
            user-select: none;
        }
        .avatar-sm {
            width: 30px;
            height: 30px;
            font-size: 14px;
        }
        .avatar-lg {
            width: 56px;
            height: 56px;
            font-size: 26px;
        }
        .avatar .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-panel);
            background: var(--text-muted);
        }
        .avatar .status-dot.online {
            background: var(--green);
        }
        .avatar .status-dot.idle {
            background: var(--yellow);
        }
        .avatar .status-dot.dnd {
            background: var(--red);
        }
        .avatar .status-dot.offline {
            background: var(--text-muted);
        }

        /* ---------- LOGIN VIEW ---------- */
        #login-view {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 20px;
        }
        #login-view .login-box {
            background: var(--bg-panel);
            border-radius: var(--radius);
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
            border: 1px solid var(--bg-card);
        }
        #login-view .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        #login-view .login-logo .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 6px;
        }
        #login-view .login-logo h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--brand), #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #login-view .login-logo p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 2px;
        }
        #login-view .form-group {
            margin-bottom: 16px;
        }
        #login-view .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        #login-view .login-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }
        #login-view .login-actions .btn {
            width: 100%;
            padding: 12px;
        }
        #login-view .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            color: var(--text-muted);
            font-size: 13px;
        }
        #login-view .login-divider::before,
        #login-view .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--bg-card);
        }

        /* ---------- APP LAYOUT ---------- */
        #app-view {
            display: none;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #app-view.active {
            display: flex;
        }

        /* ---------- SIDEBAR (servers) ---------- */
        .sidebar-servers {
            width: 72px;
            min-width: 72px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0 8px;
            gap: 6px;
            overflow-y: auto;
            overflow-x: hidden;
            height: 100vh;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
        }
        .sidebar-servers .server-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            transition: border-radius var(--transition), background var(--transition), transform 0.15s ease;
            position: relative;
            flex-shrink: 0;
            border: none;
            padding: 0;
        }
        .sidebar-servers .server-icon:hover {
            border-radius: 14px;
            background: var(--brand);
            transform: scale(1.04);
        }
        .sidebar-servers .server-icon.active {
            border-radius: 14px;
            background: var(--brand);
            box-shadow: 0 0 0 2px var(--brand);
        }
        .sidebar-servers .server-icon .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--red);
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border: 2px solid var(--bg-sidebar);
        }
        .sidebar-servers .server-divider {
            width: 32px;
            height: 2px;
            border-radius: 2px;
            background: var(--bg-card);
            margin: 4px 0;
        }
        .sidebar-servers .add-server-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px dashed var(--text-muted);
            background: transparent;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-servers .add-server-btn:hover {
            border-color: var(--brand);
            color: var(--brand);
            border-radius: 14px;
            background: var(--brand-glow);
        }
        .sidebar-servers .bottom-actions {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 4px;
        }
        .sidebar-servers .bottom-actions .btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-servers .bottom-actions .btn-icon:hover {
            background: var(--brand);
            color: #fff;
            border-radius: 14px;
        }

        /* ---------- CHANNELS SIDEBAR ---------- */
        .sidebar-channels {
            width: 240px;
            min-width: 240px;
            background: var(--bg-panel);
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }
        .sidebar-channels .channel-header {
            padding: 16px 16px 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }
        .sidebar-channels .channel-header .server-name {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-channels .channel-header .server-name .dropdown {
            margin-left: auto;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 16px;
        }
        .sidebar-channels .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 8px 16px;
        }
        .sidebar-channels .category {
            margin-top: 12px;
        }
        .sidebar-channels .category:first-child {
            margin-top: 0;
        }
        .sidebar-channels .category-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 10px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-channels .category-label .chevron {
            font-size: 10px;
            transition: transform 0.2s;
        }
        .sidebar-channels .category-label .chevron.collapsed {
            transform: rotate(-90deg);
        }
        .sidebar-channels .channel-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition);
            color: var(--text-secondary);
            font-size: 14px;
            margin: 1px 0;
        }
        .sidebar-channels .channel-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .sidebar-channels .channel-item.active {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .sidebar-channels .channel-item .icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-channels .channel-item .chan-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sidebar-channels .channel-item .chan-badge {
            font-size: 10px;
            background: var(--red);
            color: #fff;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .sidebar-channels .channel-item .voice-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--green);
        }

        /* ---------- MAIN CONTENT ---------- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100vh;
            overflow: hidden;
            min-width: 0;
        }

        /* ---------- CHAT VIEW ---------- */
        .chat-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-primary);
        }
        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-primary);
        }
        .chat-header .chan-title {
            font-size: 16px;
            font-weight: 600;
        }
        .chat-header .chan-topic {
            font-size: 13px;
            color: var(--text-secondary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-header .header-actions {
            display: flex;
            gap: 4px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .chat-messages .msg-group {
            display: flex;
            gap: 12px;
            padding: 4px 0;
        }
        .chat-messages .msg-group .msg-avatar {
            flex-shrink: 0;
            margin-top: 2px;
        }
        .chat-messages .msg-content {
            flex: 1;
            min-width: 0;
        }
        .chat-messages .msg-content .msg-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .chat-messages .msg-content .msg-header .msg-user {
            font-weight: 600;
            font-size: 14px;
        }
        .chat-messages .msg-content .msg-header .msg-time {
            font-size: 11px;
            color: var(--text-muted);
        }
        .chat-messages .msg-content .msg-text {
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            margin-top: 1px;
        }
        .chat-messages .msg-content .msg-text .mention {
            color: var(--brand);
            background: var(--brand-glow);
            padding: 0 4px;
            border-radius: 3px;
        }
        .chat-messages .msg-content .msg-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .chat-messages .msg-group:hover .msg-actions {
            opacity: 1;
        }
        .chat-messages .msg-content .msg-actions .btn-icon {
            width: 24px;
            height: 24px;
            font-size: 12px;
            background: transparent;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
        }
        .chat-messages .msg-content .msg-actions .btn-icon:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .chat-messages .msg-content .msg-reactions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .chat-messages .msg-content .msg-reactions .reaction {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px 2px 6px;
            border-radius: 12px;
            background: var(--bg-card);
            font-size: 13px;
            cursor: pointer;
            transition: background var(--transition);
            border: 1px solid transparent;
        }
        .chat-messages .msg-content .msg-reactions .reaction:hover {
            background: var(--bg-hover);
            border-color: var(--brand);
        }
        .chat-messages .msg-content .msg-reactions .reaction .count {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .chat-messages .msg-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0 8px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
        }
        .chat-messages .msg-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--bg-card);
        }
        .chat-messages .system-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 6px 0;
        }

        /* chat input */
        .chat-input-area {
            padding: 0 16px 16px;
            flex-shrink: 0;
            background: var(--bg-primary);
        }
        .chat-input-area .chat-input-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            border-radius: var(--radius);
            padding: 4px 8px 4px 14px;
            border: 1px solid transparent;
            transition: border var(--transition), box-shadow var(--transition);
        }
        .chat-input-area .chat-input-wrap:focus-within {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-glow);
        }
        .chat-input-area .chat-input-wrap .input-msg {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
            padding: 10px 0;
            outline: none;
            min-height: 40px;
            max-height: 120px;
            resize: none;
        }
        .chat-input-area .chat-input-wrap .input-msg::placeholder {
            color: var(--text-muted);
        }
        .chat-input-area .chat-input-wrap .btn-icon {
            flex-shrink: 0;
            color: var(--text-muted);
        }
        .chat-input-area .chat-input-wrap .btn-icon:hover {
            color: var(--text-primary);
        }
        .chat-input-area .chat-input-wrap .btn-send {
            background: var(--brand);
            color: #fff;
            border-radius: var(--radius-sm);

        .settings-row .color-picker::-webkit-color-swatch-wrapper {

        }
        .settings-row .color-picker::-webkit-color-swatch {

        }

        /* ---------- MISC ---------- */
        .emoji-picker-popup {
            position: absolute;
            bottom: 60px;
            left: 10px;
            background: var(--bg-panel);
            border-radius: var(--radius);
            padding: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--bg-card);
            display: none;
            grid-template-columns: repeat(8, 1fr);

            max-width: 280px;

        }
        .emoji-picker-popup.open {
            display: grid;
        }
        .emoji-picker-popup .emoji-btn {
            background: transparent;
            border: none;
            font-size: 22px;

            padding: 4px;

        .emoji-picker-popup .emoji-btn:hover {

        }
        .chat-input-wrap {
            position: relative;
        }

        /* ---------- ANIMATIONS ---------- */
        .fade-enter {
            animation: fadeIn 0.25s ease;
        }
        .slide-up {
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- LOADING ---------- */
        .loading-dots::after {
            content: '...';
            animation: dots 1.2s steps(4) infinite;
        }
        @keyframes dots {
            0% {
                content: '';
            }
            25% {
                content: '.';
            }
            50% {
                content: '..';
            }
            75% {
                content: '...';
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
    JAVASCRIPT

    <script>
        /* ============================================================
           STORAGE
           ============================================================ */
        const Storage = {
            get(key, fallback) {
                try {
                    const raw = localStorage.getItem('convo_' + key);
                    if (raw === null) return fallback;
                    return JSON.parse(raw);
                } catch { return fallback; }
            },
            set(key, value) {
                localStorage.setItem('convo_' + key, JSON.stringify(value));
            },
            remove(key) {
                localStorage.removeItem('convo_' + key);
            }
        };

        /* ============================================================
           UTILS
           ============================================================ */
        const Utils = {
            uid() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            },
            generateCode(prefix, len = 4) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = '';
                for (let i = 0; i < len; i++) {
                    code += chars[Math.floor(Math.random() * chars.length)];
                }
                return prefix + '-' + code;
            },
            timeStr(ts) {
                const d = new Date(ts);
                return d.toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit', day: '2-digit',
                    month: 'short' });
            },
            timeStrShort(ts) {
                const d = new Date(ts);
                return d.toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            },
            formatDate(ts) {
                const d = new Date(ts);
                const today = new Date();
                if (d.toDateString() === today.toDateString()) return 'Hoje';
                const yest = new Date(today);
                yest.setDate(yest.getDate() - 1);
                if (d.toDateString() === yest.toDateString()) return 'Ontem';
                return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short', year: 'numeric' });
            },
            getStatusLabel(s) {
                const map = { online: '🟢 Online', idle: '🌙 Ausente', dnd: '🔴 Ocupado', offline: '⚫ Invisível' };
                return map[s] || '🟢 Online';
            },
            getStatusDot(s) {
                const map = { online: 'online', idle: 'idle', dnd: 'dnd', offline: 'offline' };
                return map[s] || 'online';
            },
            defaultAvatar(name) {
                if (!name) return '👤';
                const emojis = ['🦊', '🐱', '🐶', '🐼', '🐨', '🦁', '🐯', '🐸', '🐵', '🦄', '🐧', '🐦', '🐤', '🐣', '🐥', '🐺', '🦝',
                    '🐮', '🐷', '🐽', '🐻', '🐻‍❄️', '🐨', '🐼', '🦊', '🐰', '🐇', '🐭', '🐹', '🐰', '🦔', '🦇', '🦉', '🦅', '🦆', '🦢',
                    '🦩', '🦚', '🦜', '🐸', '🐊', '🐢', '🦎', '🐍', '🐲', '🐉', '🦕', '🦖', '🐳', '🐋', '🐬', '🦭', '🐟', '🐠', '🐡',
                    '🦈', '🐙', '🐚', '🪸', '🐌', '🦋', '🐛', '🐜', '🐝', '🪲', '🐞', '🦗', '🪳', '🕷️', '🕸️', '🦂', '🦟', '🪰', '🪱'
                ];
                const hash = name.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
                return emojis[hash % emojis.length];
            },
            getColor(name) {
                const colors = ['#5865F2', '#ED4245', '#FAA81A', '#3BA55D', '#EB459E', '#F47B3A', '#57F287', '#FEE75C',
                    '#F0B232', '#B9BBBE', '#9B59B6', '#3498DB', '#1ABC9C', '#E67E22'
                ];
                const hash = name.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
                return colors[hash % colors.length];
            },
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },
            detectMentions(text) {
                // replace @username with styled span
                return text.replace(/@(\w+)/g, '<span class="mention">@$1</span>');
            },
            EMOJIS: ['😊', '😂', '❤️', '🔥', '👍', '👏', '🎉', '💀', '✨', '🌟', '💪', '🤣', '🥺', '😭', '😍', '🥰', '😘', '😎', '🤔',
                '🤯', '😱', '🥳', '🤩', '😤', '🤬', '😇', '🙏', '💯', '🆒', '🆗', '🆕', '🆓'
            ]
        };

        /* ============================================================
           TOAST
           ============================================================ */
        function toast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast';
            if (type === 'success') el.classList.add('toast-success');
            if (type === 'error') el.classList.add('toast-error');
            if (type === 'warning') el.classList.add('toast-warning');
            const icons = { info: 'ℹ️', success: '✅', error: '❌', warning: '⚠️' };
            el.innerHTML = `
                <span>${icons[type] || 'ℹ️'}</span>
                <span style="flex:1;">${message}</span>
                <button class="toast-close">✕</button>
            `;
            el.querySelector('.toast-close').addEventListener('click', () => {
                el.style.animation = 'slideOutRight 0.25s ease';
                setTimeout(() => el.remove(), 250);
            });
            container.appendChild(el);
            setTimeout(() => {
                if (el.parentNode) {
                    el.style.animation = 'slideOutRight 0.25s ease';
                    setTimeout(() => el.remove(), 250);
                }
            }, duration);
        }

        // ---- Server Sidebar ----
        function renderServerSidebar() {
            const container = document.getElementById('server-list');
            container.innerHTML = '';
            State.servers.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'server-icon' + (s.id === State.currentServerId ? ' active' : '');
                btn.textContent = s.icon || '📁';
                btn.title = s.name;
                btn.addEventListener('click', () => switchServer(s.id));
                container.appendChild(btn);
            });
        }

        // ---- Channel List ----
        function renderChannelList() {
            const container = document.getElementById('channel-list');
            const server = State.servers.find(s => s.id === State.currentServerId);
            if (!server) {
                container.innerHTML =
                    '<div style="padding:16px;color:var(--text-muted);text-align:center;">Nenhum servidor selecionado</div>';
                return;
            }
            document.getElementById('current-server-name').textContent = server.icon + ' ' + server.name;

            // Group by category
            const cats = {};
            const allChannels = [...server.channels, ...server.voiceChannels.map(v => ({ ...v, type: 'voice' }))];
            allChannels.forEach(c => {
                const cat = c.category || '📁 Geral';
                if (!cats[cat]) cats[cat] = [];
                cats[cat].push(c);
            });

            let html = '';
            for (const [cat, channels] of Object.entries(cats)) {
                html += `<div class="category">
                    <div class="category-label">
                        <span class="chevron">▼</span> ${cat}
                    </div>`;
                channels.forEach(c => {
                    const isActive = c.id === State.currentChannelId;
                    const isVoice = c.type === 'voice';
                    const icon = isVoice ? '🔊' : '#';
                    const badge = isVoice ? '' : '';
                    html += `
                        <div class="channel-item ${isActive ? 'active' : ''}" data-id="${c.id}" data-type="${c.type}">
                            <span class="icon">${icon}</span>
                            <span class="chan-name">${c.name}</span>
                            ${isVoice ? '<span class="voice-indicator">●</span>' : ''}
                            ${badge ? `<span class="chan-badge">${badge}</span>` : ''}
                        </div>
                    `;
                });
                html += '</div>';
            }
            container.innerHTML = html;

            // Click handlers
            container.querySelectorAll('.channel-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const type = el.dataset.type;
                    if (type === 'voice') {
                        openVoiceChannel(id);
                    } else {
                        switchChannel(id);
                    }
                    // close mobile sidebar
                    document.getElementById('channels-sidebar').classList.remove('open');
                });
            });
        }

        // ---- Chat Messages ----
        function renderMessages() {
            const container = document.getElementById('chat-messages');
            const server = State.servers.find(s => s.id === State.currentServerId);
            if (!server) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3>Nenhum servidor</h3></div>';
                return;
            }
            const channel = [...server.channels, ...server.voiceChannels].find(c => c.id === State.currentChannelId);
            if (!channel || channel.type === 'voice') {
                container.innerHTML =
                    '<div class="empty-state"><div class="empty-icon">🎙️</div><h3>Canal de voz</h3><p>Use os controles abaixo para participar da chamada.</p></div>';
                document.getElementById('chat-channel-title').textContent = '🔊 ' + (channel ? channel.name : 'Voz');
                document.getElementById('chat-channel-topic').textContent = 'Canal de voz';
                return;
            }

            document.getElementById('chat-channel-title').textContent = '# ' + channel.name;
            document.getElementById('chat-channel-topic').textContent = channel.description || 'Bem-vindo ao canal!';

            const msgs = State.messages[channel.id] || [];
            if (msgs.length === 0) {
                container.innerHTML =
                    '<div class="empty-state"><div class="empty-icon">💬</div><h3>Nenhuma mensagem</h3><p>Seja o primeiro a enviar uma mensagem!</p></div>';
                return;
            }

            let html = '';
            let lastDate = '';
            msgs.forEach((msg, idx) => {
                const date = Utils.formatDate(msg.timestamp);
                if (date !== lastDate) {
                    html += `<div class="msg-divider">${date}</div>`;
                    lastDate = date;
                }
                const avatar = msg.avatar || Utils.defaultAvatar(msg.user);
                const color = msg.color || Utils.getColor(msg.user);
                const time = Utils.timeStrShort(msg.timestamp);
                const textHtml = Utils.detectMentions(Utils.escapeHtml(msg.text));
                const isOwn = msg.user === State.user.name;
                html += `
                    <div class="msg-group" data-msgid="${msg.id}">
                        <div class="msg-avatar avatar" style="background:${color};">${avatar}</div>
                        <div class="msg-content">
                            <div class="msg-header">
                                <span class="msg-user" style="color:${color};">${Utils.escapeHtml(msg.user)}</span>
                                <span class="msg-time">${time}</span>
                            </div>
                            <div class="msg-text">${textHtml}</div>
                            <div class="msg-actions">
                                ${isOwn ? `<button class="btn-icon" data-action="delete" title="Apagar">🗑️</button>` : ''}
                                <button class="btn-icon" data-action="reply" title="Responder">↩️</button>
                                <button class="btn-icon" data-action="react" title="Reagir">😊</button>
                            </div>
                            <div class="msg-reactions" id="reactions-${msg.id}">
                                ${renderReactions(msg)}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;

            // Event listeners for actions
            container.querySelectorAll('[data-action="delete"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const group = btn.closest('.msg-group');
                    const id = group.dataset.msgid;
                    deleteMessage(id);
                });
            });
            container.querySelectorAll('[data-action="reply"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const group = btn.closest('.msg-group');
                    const user = group.querySelector('.msg-user').textContent;
                    const text = group.querySelector('.msg-text').textContent.slice(0, 60);
                    document.getElementById('chat-input').value = `@${user} `;
                    document.getElementById('chat-input').focus();
                });
            });
            container.querySelectorAll('[data-action="react"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const group = btn.closest('.msg-group');
                    const id = group.dataset.msgid;
                    showReactionPicker(id);
                });
            });
            // Reaction click
            container.querySelectorAll('.reaction').forEach(el => {
                el.addEventListener('click', () => {
                    const msgId = el.dataset.msgid;
                    const emoji = el.dataset.emoji;
                    toggleReaction(msgId, emoji);
                });
            });
        }

        function renderReactions(msg) {
            if (!msg.reactions) return '';
            let html = '';
            for (const [emoji, users] of Object.entries(msg.reactions)) {
                const count = users.length;
                const hasMe = users.includes(State.user.name);
                html += `<span class="reaction" data-msgid="${msg.id}" data-emoji="${emoji}" style="${hasMe ? 'border-color:var(--brand);' : ''}">
                    ${emoji} <span class="count">${count}</span>
                </span>`;
            }
            return html;
        }

        function showReactionPicker(msgId) {
            const picker = document.getElementById('emoji-picker');
            picker.innerHTML = '';
            Utils.EMOJIS.forEach(e => {
                const btn = document.createElement('button');
                btn.className = 'emoji-btn';
                btn.textContent = e;
                btn.addEventListener('click', () => {
                    toggleReaction(msgId, e);
                    picker.classList.remove('open');
                });
                picker.appendChild(btn);
            });
            picker.classList.toggle('open');
        }

        // ---- Voice Participants ----
        function renderVoiceParticipants() {
            const container = document.getElementById('voice-participants');
            const participants = State.voiceParticipants;
            if (participants.length === 0) {
                container.innerHTML =
                    '<div style="color:var(--text-muted);font-size:14px;padding:16px;">Nenhum participante ainda. Compartilhe o código para convidar.</div>';
                return;
            }
            let html = '';
            participants.forEach(p => {
                const isSpeaking = p.speaking || false;
                const avatar = p.avatar || Utils.defaultAvatar(p.name);
                const color = p.color || Utils.getColor(p.name);
                const isMuted = p.muted || false;
                html += `
                    <div class="participant ${isSpeaking ? 'speaking' : ''}">
                        <div class="p-avatar" style="color:${color};">${avatar}</div>
                        <div class="p-name">${Utils.escapeHtml(p.name)}</div>
                        <div class="p-status ${isMuted ? 'muted' : ''}">${isMuted ? '🔇 Mudo' : '🎤'}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        /* ============================================================
           ACTIONS
           ============================================================ */

        // ---- Switch Server ----
        function switchServer(serverId) {
            State.currentServerId = serverId;
            const server = State.servers.find(s => s.id === serverId);
            if (server && server.channels.length > 0) {
                State.currentChannelId = server.channels[0].id;
            }
            saveState();
            renderAll();
            // close voice if open
            if (State.inVoice) leaveVoice();
        }

        // ---- Switch Channel ----
        function switchChannel(channelId) {
            State.currentChannelId = channelId;
            saveState();
            // Switch to chat view
            document.getElementById('chat-view').style.display = 'flex';
            document.getElementById('voice-view').classList.remove('active');
            renderMessages();
            // re-render channels to highlight
            renderChannelList();
        }

        // ---- Open Voice Channel ----
        function openVoiceChannel(channelId) {
            const server = State.servers.find(s => s.id === State.currentServerId);
            if (!server) return;
            const channel = server.voiceChannels.find(c => c.id === channelId);
            if (!channel) return;
            State.currentChannelId = channelId;
            saveState();

            document.getElementById('chat-view').style.display = 'none';
            document.getElementById('voice-view').classList.add('active');

            const code = channel.code || Utils.generateCode('VOICE', 4);
            document.getElementById('voice-room-name').textContent = '🔊 ' + channel.name;
            document.getElementById('voice-room-code').textContent = code;
            document.getElementById('voice-share-code').textContent = code;
            State.voiceCode = code;

            // Add current user to participants
            if (!State.voiceParticipants.find(p => p.name === State.user.name)) {
                State.voiceParticipants.push({
                    name: State.user.name,
                    avatar: State.user.avatar,
                    color: State.user.color,
                    muted: State.isMuted,
                    speaking: false,
                });
            }
            renderVoiceParticipants();
            renderChannelList();
            toast('Entrou no canal de voz: ' + channel.name, 'success');
        }

        // ---- Send Message ----
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const server = State.servers.find(s => s.id === State.currentServerId);
            if (!server) return;
            const channel = [...server.channels, ...server.voiceChannels].find(c => c.id === State.currentChannelId);
            if (!channel || channel.type === 'voice') return;

            if (!State.messages[channel.id]) State.messages[channel.id] = [];
            State.messages[channel.id].push({
                id: Utils.uid(),
                user: State.user.name,
                text: text,
                timestamp: Date.now(),
                avatar: State.user.avatar,
                color: State.user.color,
                reactions: {},
            });
            saveState();
            input.value = '';
            input.style.height = 'auto';
            renderMessages();
            // Emit "typing" simulation
        }

        // ---- Delete Message ----
        function deleteMessage(msgId) {
            const server = State.servers.find(s => s.id === State.currentServerId);
            if (!server) return;
            const channel = [...server.channels, ...server.voiceChannels].find(c => c.id === State.currentChannelId);
            if (!channel) return;
            const msgs = State.messages[channel.id] || [];
            const idx = msgs.findIndex(m => m.id === msgId);
            if (idx === -1) return;
            if (msgs[idx].user !== State.user.name) {
                toast('Você só pode apagar suas próprias mensagens.', 'warning');
                return;
            }
            msgs.splice(idx, 1);
            saveState();
            renderMessages();
            toast('Mensagem apagada.', 'success');
        }

        // ---- Toggle Reaction ----
        function toggleReaction(msgId, emoji) {
            const server = State.servers.find(s => s.id === State.currentServerId);
            if (!server) return;
            const channel = [...server.channels, ...server.voiceChannels].find(c => c.id === State.currentChannelId);
            if (!channel) return;
            const msgs = State.messages[channel.id] || [];
            const msg = msgs.find(m => m.id === msgId);
            if (!msg) return;
            if (!msg.reactions) msg.reactions = {};
            if (!msg.reactions[emoji]) msg.reactions[emoji] = [];
            const idx = msg.reactions[emoji].indexOf(State.user.name);
            if (idx === -1) {
                msg.reactions[emoji].push(State.user.name);
            } else {
                msg.reactions[emoji].splice(idx, 1);
                if (msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
            }
            saveState();
            renderMessages();
            // close picker
            document.getElementById('emoji-picker').classList.remove('open');
        }

        // ---- Voice Controls ----
        function toggleMute() {
            State.isMuted = !State.isMuted;
            const btn = document.getElementById('voice-mute-btn');
            btn.textContent = State.isMuted ? '🔇 Mudo' : '🎤 Microfone';
            btn.classList.toggle('muted', State.isMuted);
            const p = State.voiceParticipants.find(p => p.name === State.user.name);
            if (p) p.muted = State.isMuted;
            renderVoiceParticipants();
            toast(State.isMuted ? 'Microfone desativado' : 'Microfone ativado', 'info');
        }

        function toggleDeafen() {
            State.isDeafened = !State.isDeafened;
            const btn = document.getElementById('voice-deafen-btn');
            btn.textContent = State.isDeafened ? '🔇 Áudio off' : '🔊 Áudio';
            btn.classList.toggle('deafened', State.isDeafened);
            toast(State.isDeafened ? 'Áudio desativado' : 'Áudio ativado', 'info');
        }

        function leaveVoice() {
            State.inVoice = false;
            State.voiceParticipants = [];
            State.isMuted = false;
            State.isDeafened = false;
            document.getElementById('voice-view').classList.remove('active');
            document.getElementById('chat-view').style.display = 'flex';
            document.getElementById('voice-mute-btn').textContent = '🎤 Microfone';
            document.getElementById('voice-mute-btn').classList.remove('muted');
            document.getElementById('voice-deafen-btn').textContent = '🔊 Áudio';
            document.getElementById('voice-deafen-btn').classList.remove('deafened');
            renderChannelList();
            renderMessages();
            toast('Saiu da chamada de voz.', 'info');
        }

        // ---- Join voice by code ----
        function joinVoiceByCode() {
            openModal(`
                <div class="modal-title">🔗 Entrar em sala de voz</div>
                <div class="modal-sub">Digite o código da sala que deseja entrar.</div>
                <div class="form-group">
                    <label>Código da sala</label>
                    <input type="text" id="modal-voice-code" class="input" placeholder="Ex: VOICE-7K29" />
                </div>
                <div class="modal-actions">
                    <button class="btn" onclick="closeModal()">Cancelar</button>
                    <button class="btn btn-primary" id="modal-voice-join-btn">Entrar</button>
                </div>
            `);
            document.getElementById('modal-voice-join-btn').addEventListener('click', () => {
                const code = document.getElementById('modal-voice-code').value.trim().toUpperCase();
                if (!code) { toast('Digite um código.', 'warning'); return; }
                // Find server with this voice channel
                let found = false;
                for (const server of State.servers) {
                    const vc = server.voiceChannels.find(c => c.code === code);
                    if (vc) {
                        State.currentServerId = server.id;
                        State.currentChannelId = vc.id;
                        saveState();
                        closeModal();
                        renderAll();
                        openVoiceChannel(vc.id);
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    // Try to create a temporary voice room
                    toast('Código não encontrado. Crie uma nova sala de voz no servidor.', 'error');
                    closeModal();
                }
            });
        }

        // ---- Create Server ----
        function createServer(name, icon, description) {
            const id = Utils.generateCode('SERVER', 4);
            const newServer = {
                id: id,
                name: name,
                description: description || '',
                icon: icon || '📁',
                channels: [
                    { id: 'CHAN-' + Utils.uid().slice(0, 6), name: 'geral', type: 'text', category: '💬 COMUNIDADE',
                        description: 'Conversa geral' },
                    { id: 'CHAN-' + Utils.uid().slice(0, 6), name: 'boas-vindas', type: 'text',
                        category: '📢 INFORMAÇÕES', description: 'Boas-vindas' },
                ],
                voiceChannels: [
                    { id: 'VOICE-' + Utils.uid().slice(0, 6), name: 'Geral', code: Utils.generateCode('VOICE', 4) },
                ]
            };
            State.servers.push(newServer);
            State.currentServerId = newServer.id;
            State.currentChannelId = newServer.channels[0].id;
            State.messages[newServer.channels[0].id] = [];
            saveState();
            renderAll();
            toast(`Servidor "${name}" criado! Código: ${id}`, 'success');
            return newServer;
        }

        /* ============================================================
           RENDER ALL
           ============================================================ */
        function renderAll() {
            renderServerSidebar();
            renderChannelList();
            // If current channel is voice, show voice view
            const server = State.servers.find(s => s.id === State.currentServerId);
            if (server) {
                const channel = [...server.channels, ...server.voiceChannels].find(c => c.id === State.currentChannelId);
                if (channel && channel.type === 'voice') {
                    document.getElementById('chat-view').style.display = 'none';
                    document.getElementById('voice-view').classList.add('active');
                    const code = channel.code || Utils.generateCode('VOICE', 4);
                    document.getElementById('voice-room-name').textContent = '🔊 ' + channel.name;
                    document.getElementById('voice-room-code').textContent = code;
                    document.getElementById('voice-share-code').textContent = code;
                    State.voiceCode = code;
                    renderVoiceParticipants();
                    return;
                }
            }
            document.getElementById('chat-view').style.display = 'flex';
            document.getElementById('voice-view').classList.remove('active');
            renderMessages();
        }

        /* ============================================================
           LOGIN
           ============================================================ */
        function handleLogin() {
            const name = document.getElementById('login-name').value.trim();
            const code = document.getElementById('login-code').value.trim().toUpperCase();
            if (!name) {
                toast('Digite seu nome.', 'warning');
                return;
            }
            if (!code) {
                toast('Digite o código do servidor.', 'warning');
                return;
            }

            // Check if server exists
            let server = State.servers.find(s => s.id === code);
            if (!server) {
                // Check if it's a voice code
                let voiceChannel = null;
                for (const s of State.servers) {
                    const vc = s.voiceChannels.find(c => c.code === code);
                    if (vc) {
                        voiceChannel = vc;
                        server = s;
                        break;
                    }
                }
                if (!server) {
                    toast('Servidor ou código não encontrado. Crie um novo servidor.', 'error');
                    return;
                }
                // It's a voice code
                State.currentServerId = server.id;
                State.currentChannelId = voiceChannel.id;
                State.user.name = name;
                State.user.avatar = Utils.defaultAvatar(name);
                State.user.color = Utils.getColor(name);
                saveState();
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('app-view').classList.add('active');
                renderAll();
                openVoiceChannel(voiceChannel.id);
                toast(`Entrou na sala de voz "${voiceChannel.name}" como ${name}`, 'success');
                return;
            }

            // Normal server login
            State.user.name = name;
            State.user.avatar = Utils.defaultAvatar(name);
            State.user.color = Utils.getColor(name);
            State.currentServerId = server.id;
            State.currentChannelId = server.channels[0]?.id || null;
            saveState();

            document.getElementById('login-view').style.display = 'none';
            document.getElementById('app-view').classList.add('active');
            renderAll();
            toast(`Bem-vindo, ${name}! Entrou em "${server.name}"`, 'success');
        }

        /* ============================================================
           EVENT BINDING
           ============================================================ */
        document.addEventListener('DOMContentLoaded', () => {

            // ---- Login ----
            document.getElementById('login-btn').addEventListener('click', handleLogin);
            document.getElementById('login-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
            document.getElementById('login-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

            // ---- Create Server from login ----
            document.getElementById('create-server-btn').addEventListener('click', () => {
                openModal(`
                    <div class="modal-title">🚀 Criar servidor</div>
                    <div class="modal-sub">Crie seu próprio servidor e convide amigos.</div>
                    <div class="form-group">
                        <label>Nome do servidor</label>
                        <input type="text" id="modal-server-name" class="input" placeholder="Ex: Minha Comunidade" />
                    </div>
                    <div class="form-group">
                        <label>Descrição (opcional)</label>
                        <input type="text" id="modal-server-desc" class="input" placeholder="O que é este servidor?" />
                    </div>
                    <div class="form-group">
                        <label>Ícone</label>
                        <div class="server-icon-picker" id="modal-icon-picker">
                            ${['🚀','💬','🎮','⚡','🔥','🌟','💎','🌈','🎯','📡','🛸','🧠','💻','🎨','🏰','🌍','🦊','🐱','🐼','🐨'].map(i =>
                                `<button class="icon-opt" data-icon="${i}">${i}</button>`
                            ).join('')}
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button class="btn" onclick="closeModal()">Cancelar</button>
                        <button class="btn btn-primary" id="modal-create-server-confirm">Criar servidor</button>
                    </div>
                `);
                let selectedIcon = '🚀';
                document.querySelectorAll('#modal-icon-picker .icon-opt').forEach(el => {
                    el.addEventListener('click', () => {
                        document.querySelectorAll('#modal-icon-picker .icon-opt').forEach(b => b.classList.remove(
                            'selected'));
                        el.classList.add('selected');
                        selectedIcon = el.dataset.icon;
                    });
                    // select first
                    if (el.dataset.icon === '🚀') el.classList.add('selected');
                });
                document.getElementById('modal-create-server-confirm').addEventListener('click', () => {
                    const name = document.getElementById('modal-server-name').value.trim();
                    if (!name) { toast('Digite um nome para o servidor.', 'warning'); return; }
                    const desc = document.getElementById('modal-server-desc').value.trim();
                    const server = createServer(name, selectedIcon, desc);
                    closeModal();
                    // If user not logged in, auto-login with a default name
                    if (!State.user.name) {
                        State.user.name = 'Anfitrião';
                        State.user.avatar = '👑';
                        State.user.color = '#FAA81A';
                        saveState();
                        document.getElementById('login-view').style.display = 'none';
                        document.getElementById('app-view').classList.add('active');
                        renderAll();
                        toast('Servidor criado! Você entrou como Anfitrião.', 'success');
                    } else {
                        renderAll();
                    }
                });
            });

            // ---- Sidebar add server ----
            document.getElementById('sidebar-add-server').addEventListener('click', () => {
                document.getElementById('create-server-btn').click();
            });

            // ---- Quick join voice ----
            document.getElementById('quick-join-btn').addEventListener('click', joinVoiceByCode);

            // ---- Send message ----
            document.getElementById('send-btn').addEventListener('click', sendMessage);
            document.getElementById('chat-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            // Auto-resize textarea
            document.getElementById('chat-input').addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // ---- Emoji picker ----
            document.getElementById('emoji-toggle').addEventListener('click', () => {
                const picker = document.getElementById('emoji-picker');
                if (picker.classList.contains('open')) {
                    picker.classList.remove('open');
                    return;
                }
                picker.innerHTML = '';
                Utils.EMOJIS.forEach(e => {
                    const btn = document.createElement('button');
                    btn.className = 'emoji-btn';
                    btn.textContent = e;
                    btn.addEventListener('click', () => {
                        const input = document.getElementById('chat-input');
                        input.value += e;
                        input.focus();
                        picker.classList.remove('open');
                    });
                    picker.appendChild(btn);
                });
                picker.classList.add('open');
            });
            // Close emoji picker on click outside
            document.addEventListener('click', (e) => {
                const picker = document.getElementById('emoji-picker');
                const toggle = document.getElementById('emoji-toggle');
                if (!picker.contains(e.target) && !toggle.contains(e.target)) {
                    picker.classList.remove('open');
                }
            });

            // ---- Attach file ----
            document.getElementById('attach-btn').addEventListener('click', () => {
                toast('📎 Anexo de arquivos (simulação)', 'info');
            });

            // ---- Voice controls ----
            document.getElementById('voice-mute-btn').addEventListener('click', toggleMute);
            document.getElementById('voice-deafen-btn').addEventListener('click', toggleDeafen);
            document.getElementById('voice-leave-btn').addEventListener('click', leaveVoice);

            // ---- Voice copy code ----
            document.getElementById('voice-copy-code').addEventListener('click', () => {
                const code = document.getElementById('voice-share-code').textContent;
                navigator.clipboard.writeText(code).then(() => {
                    toast('Código copiado! 📋', 'success');
                }).catch(() => {
                    // fallback
                    const ta = document.createElement('textarea');
                    ta.value = code;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    toast('Código copiado! 📋', 'success');
                });
            });

            // ---- Voice join code ----
            document.getElementById('voice-join-code').addEventListener('click', joinVoiceByCode);

            // ---- Search ----
            document.getElementById('chat-search-btn').addEventListener('click', () => {
                toast('🔍 Busca de mensagens (simulação)', 'info');
            });

            // ---- Pins ----
            document.getElementById('chat-pins-btn').addEventListener('click', () => {
                toast('📌 Mensagens fixadas (simulação)', 'info');
            });

            // ---- Profile ----
            document.getElementById('sidebar-profile').addEventListener('click', () => {
                const statuses = ['online', 'idle', 'dnd', 'offline'];
                openModal(`
                    <div class="modal-title">👤 Perfil</div>
                    <div class="modal-sub">Suas informações no ConvoHub.</div>
                    <div class="settings-row">
                        <label>Nome</label>
                        <input type="text" id="profile-name" class="input" value="${Utils.escapeHtml(State.user.name)}" />
                    </div>
                    <div class="settings-row">
                        <label>Avatar</label>
                        <input type="text" id="profile-avatar" class="input" value="${State.user.avatar}" placeholder="Ex: 🦊" maxlength="2" />
                    </div>
                    <div class="settings-row">
                        <label>Cor</label>
                        <input type="color" id="profile-color" class="color-picker" value="${State.user.color}" />
                    </div>
                    <div class="settings-row">
                        <label>Status</label>
                        <select id="profile-status" class="status-select">
                            ${statuses.map(s => `<option value="${s}" ${s === State.user.status ? 'selected' : ''}>${Utils.getStatusLabel(s)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button class="btn" onclick="closeModal()">Fechar</button>
                        <button class="btn btn-primary" id="profile-save-btn">Salvar</button>
                    </div>
                `);
                document.getElementById('profile-save-btn').addEventListener('click', () => {
                    const name = document.getElementById('profile-name').value.trim();
                    const avatar = document.getElementById('profile-avatar').value.trim() || '👤';
                    const color = document.getElementById('profile-color').value;
                    const status = document.getElementById('profile-status').value;
                    if (!name) { toast('Digite um nome.', 'warning'); return; }
                    State.user.name = name;
                    State.user.avatar = avatar;
                    State.user.color = color;
                    State.user.status = status;
                    saveState();
                    closeModal();
                    renderAll();
                    toast('Perfil atualizado!', 'success');
                });
            });

            // ---- Settings ----
            document.getElementById('sidebar-settings').addEventListener('click', () => {
                openModal(`
                    <div class="modal-title">⚙️ Configurações</div>
                    <div class="modal-sub">Ajustes da plataforma.</div>
                    <div class="settings-row">
                        <label>Tema</label>
                        <select id="settings-theme" class="status-select">
                            <option value="dark" selected>🌙 Escuro</option>
                            <option value="light">☀️ Claro (em breve)</option>
                        </select>
                    </div>
                    <div class="settings-row">
                        <label>Notificações</label>
                        <select id="settings-notif" class="status-select">
                            <option value="all">Todas</option>
                            <option value="mentions">Menções</option>
                            <option value="none">Nenhuma</option>
                        </select>
                    </div>
                    <div style="margin-top:16px;padding:12px;background:var(--bg-card);border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);">
                        <strong>💡 Sobre o ConvoHub</strong><br>
                        Esta é uma plataforma de comunicação inspirada em apps modernos.
                        As chamadas de voz utilizam WebRTC (P2P). Para uma experiência completa,
                        um servidor de sinalização é necessário.
                        <br><br>
                        <span style="font-size:12px;color:var(--text-muted);">
                            Versão 1.0 — HTML/CSS/JS + localStorage
                        </span>
                    </div>
                    <div class="modal-actions">
                        <button class="btn" onclick="closeModal()">Fechar</button>
                    </div>
                `);
            });

            // ---- Mobile channel toggle ----
            document.getElementById('mobile-toggle-channels').addEventListener('click', () => {
                document.getElementById('channels-sidebar').classList.toggle('open');
            });

            // ---- Server dropdown (for mobile) ----
            document.getElementById('server-dropdown').addEventListener('click', () => {
                // Show server switcher
                const serverList = State.servers.map(s =>
                    `<div style="padding:8px 12px;cursor:pointer;border-radius:var(--radius-sm);background:${s.id === State.currentServerId ? 'var(--bg-hover)' : 'transparent'};" data-sid="${s.id}">${s.icon} ${s.name}</div>`
                ).join('');
                openModal(`
                    <div class="modal-title">📁 Servidores</div>
                    <div class="modal-sub">Selecione um servidor para entrar.</div>
                    <div style="display:flex;flex-direction:column;gap:4px;">
                        ${serverList}
                    </div>
                    <div class="modal-actions">
                        <button class="btn" onclick="closeModal()">Fechar</button>
                    </div>
                `);
                document.querySelectorAll('#modal-content [data-sid]').forEach(el => {
                    el.addEventListener('click', () => {
                        const sid = el.dataset.sid;
                        closeModal();
                        switchServer(sid);
                    });
                });
            });

            // ---- Demo hint click ----
            document.getElementById('demo-hint').addEventListener('click', () => {
                document.getElementById('login-code').value = 'SERVER-DEMO';
                document.getElementById('login-name').value = 'Visitante';
                toast('📋 Código preenchido! Clique em Entrar.', 'success');
            });

            // ---- Auto-login if user exists ----
            if (State.user.name && State.currentServerId) {
                const server = State.servers.find(s => s.id === State.currentServerId);
                if (server) {
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-view').classList.add('active');
                    renderAll();
                    // Restore voice if needed
                    const channel = [...server.channels, ...server.voiceChannels].find(c => c.id === State
                        .currentChannelId);
                    if (channel && channel.type === 'voice') {
                        openVoiceChannel(channel.id);
                    }
                } else {
                    // Reset
                    State.currentServerId = null;
                    saveState();
                }
            }

            // ---- WebRTC / Voice simulation ----
            // In a real implementation, this would use RTCPeerConnection
            // For demo, we simulate participants
            // The code is prepared for WebRTC integration

            console.log('🔊 ConvoHub carregado!');
            console.log('📡 WebRTC preparado para integração com servidor de sinalização.');
            console.log('💾 Dados salvos em localStorage.');

            // ---- Simulate voice speaking indicator ----
            setInterval(() => {
                if (State.inVoice && State.voiceParticipants.length > 1) {
                    // Randomly make someone speak
                    const idx = Math.floor(Math.random() * State.voiceParticipants.length);
                    State.voiceParticipants.forEach((p, i) => p.speaking = (i === idx));
                    renderVoiceParticipants();
                }
            }, 4000);

            // ---- Auto-save messages periodically ----
            setInterval(() => {
                saveState();
            }, 30000);

        });

        // ---- Expose for modal onclick ----
        window.closeModal = closeModal;
        window.openModal = openModal;
        window.toast = toast;
        window.Utils = Utils;
        window.State = State;
        window.switchServer = switchServer;
        window.switchChannel = switchChannel;
        window.openVoiceChannel = openVoiceChannel;
        window.leaveVoice = leaveVoice;
        window.joinVoiceByCode = joinVoiceByCode;
        window.createServer = createServer;
        window.sendMessage = sendMessage;
        window.deleteMessage = deleteMessage;
        window.toggleReaction = toggleReaction;
        window.renderAll = renderAll;
        window.saveState = saveState;
    </script>
</body>
</html>
